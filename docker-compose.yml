services:
  api:
    build: ./backend
    environment:
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "3001:3001"
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:3001
    ports:
      - "5173:5173"
    depends_on:
      - api
